  /api/v1/analytics/dashboards/{name}/:
    get:
      operationId: analytics_dashboards_retrieve
      parameters:
      - in: query
        name: date_from
        schema:
          type: string
          format: date
      - in: query
        name: date_to
        schema:
          type: string
          format: date
      - in: path
        name: name
        schema:
          type: string
        required: true
      tags:
      - analytics
      security:
      - cookieSession: []
        bearerSession: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalyticsResult'
          description: ''
  /api/v1/analytics/forecast/:
    get:
      operationId: analytics_forecast_retrieve
      parameters:
      - in: query
        name: alpha
        schema:
          type: string
          format: decimal
          pattern: ^-?\d{0,1}(?:\.\d{0,2})?$
          default: '0.30'
      - in: query
        name: history_months
        schema:
          type: integer
          maximum: 36
          minimum: 3
          default: 12
      - in: query
        name: horizon_months
        schema:
          type: integer
          maximum: 12
          minimum: 1
          default: 3
      - in: query
        name: item
        schema:
          type: string
          format: uuid
        required: true
      - in: query
        name: method
        schema:
          enum:
          - moving_average
          - exponential_smoothing
          type: string
          default: moving_average
          minLength: 1
        description: |-
          * `moving_average` - moving_average
          * `exponential_smoothing` - exponential_smoothing
      - in: query
        name: window
        schema:
          type: integer
          maximum: 12
          minimum: 1
          default: 3
      tags:
      - analytics
      security:
      - cookieSession: []
        bearerSession: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalyticsResult'
          description: ''
