        technician:
          type: string
          format: uuid
          nullable: true
        labour_hours:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          readOnly: true
        spare_cost:
          type: string
          format: decimal
          pattern: ^-?\d{0,16}(?:\.\d{0,4})?$
          readOnly: true
        notes:
          type: string
          readOnly: true
        spares:
          type: array
          items:
            $ref: '#/components/schemas/WorkOrderSpare'
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - asset
      - asset_code
      - checklist
      - closed_at
      - completed_at
      - created_at
      - downtime_minutes
      - due_key
      - facility
      - id
      - kind
      - labour_hours
      - notes
      - number
      - plan
      - spare_cost
      - spares
      - started_at
      - status
      - version
    WorkOrderCancelRequest:
      type: object
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 300
        version:
          type: integer
      required:
      - reason
    WorkOrderCompleteRequest:
      type: object
      properties:
        completed_at:
          type: string
          format: date-time
          nullable: true
        downtime_minutes:
          type: integer
          minimum: 0
          nullable: true
        labour_hours:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          nullable: true
        notes:
          type: string
          default: ''
        checklist:
          type: array
          items: {}
          nullable: true
        version:
          type: integer
    WorkOrderKindEnum:
      enum:
      - preventive
      - breakdown
      type: string
      description: |-
        * `preventive` - Preventive
        * `breakdown` - Breakdown
    WorkOrderRequest:
      type: object
      properties:
        kind:
          $ref: '#/components/schemas/WorkOrderKindEnum'
        asset:
          type: string
          format: uuid
        description:
          type: string
        reported_at:
          type: string
          format: date-time
        technician:
          type: string
          format: uuid
          nullable: true
      required:
      - asset
      - kind
    WorkOrderSpare:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        item:
          type: string
          format: uuid
          readOnly: true
        item_code:
          type: string
          readOnly: true
        warehouse:
          type: string
          format: uuid
          readOnly: true
        quantity:
          type: string
          format: decimal
          pattern: ^-?\d{0,14}(?:\.\d{0,6})?$
          readOnly: true
        value:
          type: string
          format: decimal
          pattern: ^-?\d{0,16}(?:\.\d{0,4})?$
          readOnly: true
        stock_transaction:
          type: string
          format: uuid
          readOnly: true
        issued_on:
          type: string
          format: date
          readOnly: true
        issued_by:
          type: string
          format: uuid
          readOnly: true
          nullable: true
      required:
      - id
      - issued_by
      - issued_on
      - item
      - item_code
      - quantity
      - stock_transaction
      - value
      - warehouse
    WorkOrderStartRequest:
      type: object
      properties:
        started_at:
          type: string
          format: date-time
          nullable: true
        technician:
          type: string
          format: uuid
          nullable: true
        version:
          type: integer
    WorkOrderStatusEnum:
      enum:
      - open
      - in_progress
      - completed
      - closed
      - cancelled
      type: string
      description: |-
        * `open` - Open
        * `in_progress` - In Progress
        * `completed` - Completed
        * `closed` - Closed
        * `cancelled` - Cancelled
  securitySchemes:
    bearerSession:
      type: http
      scheme: bearer
      description: 'Mobile/API: opaque session token.'
    cookieSession:
      type: apiKey
      in: cookie
      name: erp_session
      description: 'Web: HttpOnly session cookie plus X-CSRF-Token header on unsafe
        methods.'
