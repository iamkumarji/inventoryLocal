# Development stack: backing services only. Run Django locally (see README) or
# enable the `app` profile to run the API, worker and beat in containers.
name: otabu-erp-dev
services:
  postgres:
    image: postgres:16.4-alpine
    environment:
      POSTGRES_DB: otabu_erp
      POSTGRES_USER: otabu_erp
      POSTGRES_PASSWORD: otabu_dev_only
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U otabu_erp"]
      interval: 5s
      retries: 10
  redis:
    image: redis:7.4-alpine
    ports: ["6379:6379"]
  minio:
    image: minio/minio:RELEASE.2024-10-13T13-34-11Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: erp-dev
      MINIO_ROOT_PASSWORD: erp-dev-only-password
    ports: ["9000:9000", "9001:9001"]
    volumes: [miniodata:/data]
  api:
    profiles: ["app"]
    build: {context: .., dockerfile: infrastructure/docker/backend.Dockerfile}
    environment: &app_env
      DJANGO_SETTINGS_MODULE: config.settings.dev
      DATABASE_URL: postgres://otabu_erp:otabu_dev_only@postgres:5432/otabu_erp
      REDIS_URL: redis://redis:6379/0
    command: sh -c "python manage.py migrate && uvicorn config.asgi:application --host 0.0.0.0 --port 8000 --reload"
    ports: ["8000:8000"]
    depends_on: {postgres: {condition: service_healthy}, redis: {condition: service_started}}
  worker:
    profiles: ["app"]
    build: {context: .., dockerfile: infrastructure/docker/backend.Dockerfile}
    environment: *app_env
    command: celery -A config worker -l info -Q default,outbox,notifications,reports,integrations,scheduled
    depends_on: [api]
  beat:
    profiles: ["app"]
    build: {context: .., dockerfile: infrastructure/docker/backend.Dockerfile}
    environment: *app_env
    command: celery -A config beat -l info
    depends_on: [api]
volumes:
  pgdata:
  miniodata:
