openapi: 3.0.3
info:
  title: OtabuPro ERP API
  version: 1.0.0
  description: Enterprise manufacturing ERP. See docs/API_SPECIFICATION.md for conventions.
paths:
  /api/v1/admin/feature-flags/:
    get:
      operationId: admin_feature_flags_list
      parameters:
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - admin
      security:
      - cookieSession: []
        bearerSession: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FeatureFlag'
          description: ''
  /api/v1/admin/feature-flags/{id}/:
    get:
      operationId: admin_feature_flags_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this feature flag.
        required: true
      tags:
      - admin
      security:
      - cookieSession: []
        bearerSession: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeatureFlag'
          description: ''
    patch:
      operationId: admin_feature_flags_partial_update
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this feature flag.
        required: true
      tags:
