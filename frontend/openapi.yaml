      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedFeatureFlagRequest'
      security:
      - cookieSession: []
        bearerSession: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeatureFlag'
          description: ''
  /api/v1/admin/outbox-events/:
    get:
      operationId: admin_outbox_events_list
      description: Operational view of the outbox (dead letters can be retried).
      parameters:
      - in: query
        name: aggregate_id
        schema:
          type: string
          format: uuid
      - in: query
        name: aggregate_type
        schema:
          type: string
      - in: query
        name: event_type
        schema:
          type: string
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: status
        schema:
          type: string
          enum:
          - dead
          - failed
          - pending
          - published
        description: |-
          * `pending` - Pending
          * `published` - Published
          * `failed` - Failed
          * `dead` - Dead
      tags:
      - admin
      security:
      - cookieSession: []
        bearerSession: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedOutboxEventList'
          description: ''
  /api/v1/admin/outbox-events/{id}/:
    get:
      operationId: admin_outbox_events_retrieve
      description: Operational view of the outbox (dead letters can be retried).
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this outbox event.
        required: true
      tags:
      - admin
      security:
      - cookieSession: []
        bearerSession: []
      responses:
        '200':
